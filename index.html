<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads University — Chat with Admissions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #16294F;
    --navy-deep: #0E1B38;
    --gold: #C89B3C;
    --paper: #F7F5F0;
    --paper-card: #FFFFFF;
    --bubble-agent: #FFFFFF;
    --bubble-user: #16294F;
    --ink: #1A1D22;
    --ink-soft: #6B7185;
    --line: #E3DFD3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--paper);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    color: var(--ink);
  }
  .serif { font-family: 'Source Serif 4', Georgia, serif; }

  .app {
    max-width: 620px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--navy);
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: #fff;
    object-fit: contain;
    flex-shrink: 0;
    padding: 2px;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header p { font-size: 12.5px; color: rgba(255,255,255,0.68); margin-top: 1px; }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #4ADE80; display: inline-block; margin-right: 5px;
    box-shadow: 0 0 0 0 rgba(74,222,128,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(74,222,128,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg-row.agent .bubble {
    background: var(--bubble-agent);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
    color: var(--ink);
  }
  .msg-row.user .bubble {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg-time {
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: 3px;
    padding: 0 4px;
  }
  .msg-row.user .msg-time { text-align: right; }

  .typing {
    display: flex; gap: 4px; padding: 13px 15px;
    background: var(--bubble-agent);
    border: 1px solid var(--line);
    border-radius: 16px; border-bottom-left-radius: 4px;
    width: fit-content;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-soft);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

  .composer {
    display: flex;
    gap: 10px;
    padding: 14px 16px 18px;
    background: var(--paper);
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }
  .composer input {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--paper-card);
    border-radius: 24px;
    padding: 12px 18px;
    font-size: 14.5px;
    font-family: inherit;
    color: var(--ink);
    outline: none;
  }
  .composer input:focus { border-color: var(--gold); }
  .composer button {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--navy);
    border: none;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .composer button:hover { background: var(--navy-deep); }
  .composer button:disabled { opacity: 0.4; cursor: default; }

  .status-banner {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 8px;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <img class="avatar" src="https://www.leads.edu.pk/wp-content/uploads/2021/02/cropped-cropped-LLU-LOGOf-1.png" alt="Leads Logo">
    <div>
      <h1>Leads University — Islamabad Campus</h1>
    </div>
  </header>

  <div class="messages" id="messages">
    <div class="status-banner" id="statusBanner">Connecting…</div>
  </div>

  <form class="composer" id="composer">
    <input type="text" id="input" placeholder="Ask about fees, admissions, hostel…" autocomplete="off" disabled>
    <button type="submit" id="sendBtn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/>
      </svg>
    </button>
  </form>
</div>

<script>
(function () {
  var API = 'https://careagent-ai-be-production.up.railway.app';
  var TOKEN = '404a16992c2c476d57271cb8f78329cd'; // same livechat token as the embedded widget
  var STORAGE_KEY = '_leads_chat_session_' + TOKEN;

  var messagesEl = document.getElementById('messages');
  var statusBanner = document.getElementById('statusBanner');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  var composer = document.getElementById('composer');

  var sessionId = null;
  var lastMessageAt = null;
  var pollTimer = null;
  var typingEl = null;

  function fmtTime(iso) {
    try {
      return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }

  function addMessage(role, content, createdAt) {
    var row = document.createElement('div');
    row.className = 'msg-row ' + (role === 'agent' ? 'agent' : 'user');
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = content;
    var time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = fmtTime(createdAt || new Date().toISOString());
    var wrap = document.createElement('div');
    wrap.appendChild(bubble);
    wrap.appendChild(time);
    row.appendChild(wrap);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement('div');
    typingEl.className = 'msg-row agent';
    typingEl.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  async function initSession() {
    var visitorId = localStorage.getItem(STORAGE_KEY + '_vid');
    if (!visitorId) {
      visitorId = 'visitor-' + Math.random().toString(36).slice(2) + Date.now();
      localStorage.setItem(STORAGE_KEY + '_vid', visitorId);
    }
    try {
      var res = await fetch(API + '/api/livechat/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ livechatToken: TOKEN, visitorId: visitorId, visitorName: 'Website Visitor' }),
      });
      var data = await res.json();
      sessionId = data.sessionId;
      statusBanner.style.display = 'none';

      if (data.messages && data.messages.length) {
        data.messages.forEach(function (m) { addMessage(m.role, m.content, m.createdAt); });
        lastMessageAt = data.messages[data.messages.length - 1].createdAt;
      } else {
        addMessage('agent', "Hi! I'm the admissions assistant for Leads University Islamabad Campus. Ask me about fees, scholarships, hostel facilities, or anything else — or say you'd like to register a Help Desk complaint.", new Date().toISOString());
        lastMessageAt = new Date().toISOString();
      }

      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
      startPolling();
    } catch (err) {
      statusBanner.textContent = 'Could not connect — please refresh the page.';
    }
  }

  async function poll() {
    if (!sessionId) return;
    try {
      var url = API + '/api/livechat/poll/' + sessionId + (lastMessageAt ? '?after=' + encodeURIComponent(lastMessageAt) : '');
      var res = await fetch(url);
      if (!res.ok) return;
      var data = await res.json();
      if (data.messages && data.messages.length) {
        hideTyping();
        data.messages.forEach(function (m) {
          if (m.role === 'agent') addMessage('agent', m.content, m.createdAt);
          lastMessageAt = m.createdAt;
        });
      }
    } catch (err) { /* silent — next poll tick will retry */ }
  }

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(poll, 2500);
  }

  composer.addEventListener('submit', async function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || !sessionId) return;
    addMessage('user', text, new Date().toISOString());
    input.value = '';
    showTyping();
    try {
      await fetch(API + '/api/livechat/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: sessionId, content: text }),
      });
    } catch (err) {
      hideTyping();
      addMessage('agent', "Sorry, that didn't send — please try again.", new Date().toISOString());
    }
  });

  initSession();
})();
</script>

</body>
</html>
