<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads University — Chat with Admissions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #16294F;
    --navy-deep: #0E1B38;
    --gold: #C89B3C;
    --paper: #F7F5F0;
    --paper-card: #FFFFFF;
    --bubble-agent: #FFFFFF;
    --bubble-user: #16294F;
    --ink: #1A1D22;
    --ink-soft: #6B7185;
    --line: #E3DFD3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--paper);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    color: var(--ink);
  }
  .serif { font-family: 'Source Serif 4', Georgia, serif; }

  /* ---------- Floating launcher ---------- */
  #launcher {
    position: fixed;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    right: calc(28px + env(safe-area-inset-right, 0px));
    width: 76px; height: 76px; border-radius: 50%;
    background: var(--navy); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 28px rgba(22, 41, 79, 0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    z-index: 9998;
  }
  #launcher:hover { transform: scale(1.06); box-shadow: 0 10px 32px rgba(22, 41, 79, 0.55); }
  #launcher svg { width: 34px; height: 34px; }
  #launcher .pulse-ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid var(--gold); opacity: 0;
    animation: pulseRing 2.2s ease-out infinite;
  }
  @keyframes pulseRing {
    0% { transform: scale(1); opacity: 0.9; }
    100% { transform: scale(1.7); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #launcher .pulse-ring { animation: none; }
  }

  #launcherLabel {
    position: fixed;
    bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    right: calc(112px + env(safe-area-inset-right, 0px));
    background: var(--paper); color: var(--navy);
    padding: 11px 16px; border-radius: 12px;
    font-weight: 600; font-size: 14px;
    box-shadow: 0 6px 20px rgba(22, 41, 79, 0.2);
    border: 1px solid #E6E8F0;
    white-space: nowrap;
    animation: labelFloat 2.4s ease-in-out infinite;
    z-index: 9997;
    pointer-events: none;
  }
  #launcherLabel::after {
    content: ""; position: absolute; top: 50%; right: -6px;
    transform: translateY(-50%) rotate(45deg);
    width: 12px; height: 12px; background: var(--paper);
    border-right: 1px solid #E6E8F0; border-bottom: 1px solid #E6E8F0;
  }
  @keyframes labelFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @media (prefers-reduced-motion: reduce) {
    #launcherLabel { animation: none; }
  }
  @media (max-width: 600px) {
    #launcherLabel { display: none; }
  }

  /* ---------- Panel ---------- */
  #panel {
    position: fixed; bottom: 24px; right: 24px;
    width: 380px; max-width: calc(100vw - 32px);
    height: 620px; max-height: calc(100vh - 48px);
    background: var(--paper); border-radius: 16px;
    box-shadow: 0 12px 40px rgba(22, 41, 79, 0.25);
    display: none; flex-direction: column; overflow: hidden;
    z-index: 9999;
  }
  #panel.open { display: flex; }

  @media (max-width: 600px) {
    #panel {
      right: 0; left: 0; top: 0; bottom: 0;
      width: 100%; max-width: 100%;
      height: 100dvh; max-height: 100dvh;
      border-radius: 0;
    }
    #launcher {
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      right: calc(16px + env(safe-area-inset-right, 0px));
    }
  }

  header {
    background: var(--navy);
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    border-bottom: 3px solid var(--gold);
  }
  header .titles { flex: 1; min-width: 0; }
  header .close {
    background: none; border: none; color: rgba(255,255,255,0.8);
    font-size: 26px; line-height: 1; cursor: pointer;
    padding: 4px; margin: -4px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  header .close:hover { color: #fff; }
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: #fff;
    object-fit: contain;
    flex-shrink: 0;
    padding: 2px;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header p { font-size: 12.5px; color: rgba(255,255,255,0.68); margin-top: 1px; }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #4ADE80; display: inline-block; margin-right: 5px;
    box-shadow: 0 0 0 0 rgba(74,222,128,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(74,222,128,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .msg-wrap {
    max-width: 78%;
    display: flex;
    flex-direction: column;
  }
  .bubble {
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-row.agent .bubble {
    background: var(--bubble-agent);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
    color: var(--ink);
  }
  .msg-row.user .bubble {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg-time {
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: 3px;
    padding: 0 4px;
  }
  .msg-row.user .msg-time { text-align: right; }

  .typing {
    display: flex; gap: 4px; padding: 13px 15px;
    background: var(--bubble-agent);
    border: 1px solid var(--line);
    border-radius: 16px; border-bottom-left-radius: 4px;
    width: fit-content;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-soft);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

  .composer {
    display: flex;
    gap: 10px;
    padding: 14px 16px 18px;
    background: var(--paper);
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }
  .composer input {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--paper-card);
    border-radius: 24px;
    padding: 12px 18px;
    font-size: 14.5px;
    font-family: inherit;
    color: var(--ink);
    outline: none;
  }
  .composer input:focus { border-color: var(--gold); }
  .composer button {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--navy);
    border: none;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .composer button:hover { background: var(--navy-deep); }
  .composer button:disabled { opacity: 0.4; cursor: default; }

  .status-banner {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 8px;
  }
</style>
</head>
<body>

<div id="launcherLabel">💬 Ask us anything!</div>
<button id="launcher" aria-label="Open chat">
  <span class="pulse-ring"></span>
  <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M24 4 L42 10 V24 C42 34 34.5 41.5 24 45 C13.5 41.5 6 34 6 24 V10 Z" fill="none" stroke="#C89B3C" stroke-width="2.5"/>
    <rect x="14" y="27" width="4" height="8" rx="1" fill="#C89B3C"/>
    <rect x="20" y="22" width="4" height="13" rx="1" fill="#C89B3C"/>
    <rect x="26" y="17" width="4" height="18" rx="1" fill="#C89B3C"/>
    <rect x="32" y="12" width="4" height="23" rx="1" fill="#C89B3C"/>
  </svg>
</button>

<div id="panel" class="app">
  <header>
    <img class="avatar" src="https://www.leads.edu.pk/wp-content/uploads/2021/02/cropped-cropped-LLU-LOGOf-1.png" alt="Leads Logo">
    <div class="titles">
      <h1>Leads University — Islamabad Campus</h1>
    </div>
    <button class="close" id="closeBtn" aria-label="Close chat">&times;</button>
  </header>

  <div class="messages" id="messages">
    <div class="status-banner" id="statusBanner">Connecting…</div>
  </div>

  <form class="composer" id="composer">
    <input type="text" id="input" placeholder="Ask about fees, admissions, hostel…" autocomplete="off" disabled>
    <button type="submit" id="sendBtn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/>
      </svg>
    </button>
  </form>
</div>

<script>
(function () {
  var API = 'https://careagent-ai-be-production.up.railway.app';
  var TOKEN = '404a16992c2c476d57271cb8f78329cd'; // same livechat token as the embedded widget
  var STORAGE_KEY = '_leads_chat_session_' + TOKEN;

  var messagesEl = document.getElementById('messages');
  var statusBanner = document.getElementById('statusBanner');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  var composer = document.getElementById('composer');
  
  var launcher = document.getElementById('launcher');
  var launcherLabel = document.getElementById('launcherLabel');
  var panel = document.getElementById('panel');
  var closeBtn = document.getElementById('closeBtn');

  var sessionId = null;
  var lastMessageAt = null;
  var pollTimer = null;
  var typingEl = null;

  launcher.addEventListener('click', function() {
    panel.classList.add('open');
    launcher.style.display = 'none';
    if (launcherLabel) launcherLabel.style.display = 'none';
    input.focus();
  });

  closeBtn.addEventListener('click', function() {
    panel.classList.remove('open');
    launcher.style.display = 'flex';
    if (launcherLabel && window.innerWidth > 600) launcherLabel.style.display = 'block';
  });

  function fmtTime(iso) {
    try {
      return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }

  function addMessage(role, content, createdAt) {
    var row = document.createElement('div');
    row.className = 'msg-row ' + (role === 'agent' ? 'agent' : 'user');
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = content;
    var time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = fmtTime(createdAt || new Date().toISOString());
    var wrap = document.createElement('div');
    wrap.className = 'msg-wrap';
    wrap.appendChild(bubble);
    wrap.appendChild(time);
    row.appendChild(wrap);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement('div');
    typingEl.className = 'msg-row agent';
    typingEl.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  async function initSession() {
    var visitorId = localStorage.getItem(STORAGE_KEY + '_vid');
    if (!visitorId) {
      visitorId = 'visitor-' + Math.random().toString(36).slice(2) + Date.now();
      localStorage.setItem(STORAGE_KEY + '_vid', visitorId);
    }
    try {
      var res = await fetch(API + '/api/livechat/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ livechatToken: TOKEN, visitorId: visitorId, visitorName: 'Website Visitor' }),
      });
      var data = await res.json();
      sessionId = data.sessionId;
      statusBanner.style.display = 'none';

      if (data.messages && data.messages.length) {
        data.messages.forEach(function (m) { addMessage(m.role, m.content, m.createdAt); });
        lastMessageAt = data.messages[data.messages.length - 1].createdAt;
      } else {
        addMessage('agent', "Hi! I'm the admissions assistant for Leads University Islamabad Campus. Ask me about fees, scholarships, hostel facilities, or anything else — or say you'd like to register a Help Desk complaint.", new Date().toISOString());
        lastMessageAt = new Date().toISOString();
      }

      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
      startPolling();
    } catch (err) {
      statusBanner.textContent = 'Could not connect — please refresh the page.';
    }
  }

  async function poll() {
    if (!sessionId) return;
    try {
      var url = API + '/api/livechat/poll/' + sessionId + (lastMessageAt ? '?after=' + encodeURIComponent(lastMessageAt) : '');
      var res = await fetch(url);
      if (!res.ok) return;
      var data = await res.json();
      if (data.messages && data.messages.length) {
        hideTyping();
        data.messages.forEach(function (m) {
          if (m.role === 'agent') addMessage('agent', m.content, m.createdAt);
          lastMessageAt = m.createdAt;
        });
      }
    } catch (err) { /* silent — next poll tick will retry */ }
  }

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(poll, 2500);
  }

  composer.addEventListener('submit', async function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || !sessionId) return;
    addMessage('user', text, new Date().toISOString());
    input.value = '';
    showTyping();
    try {
      await fetch(API + '/api/livechat/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: sessionId, content: text }),
      });
    } catch (err) {
      hideTyping();
      addMessage('agent', "Sorry, that didn't send — please try again.", new Date().toISOString());
    }
  });

  initSession();
})();
</script>

</body>
</html>
